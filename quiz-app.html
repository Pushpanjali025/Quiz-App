<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz App</title>
        <link rel="stylesheet"href="quiz-app.css">
       
    </head> 
    <body>
        <div class="quiz-container">
            <h2 id="quiz-question"> 
                Question1:When a function is called by its name, then it is _____.
            </h2>
            <ul>
                <li>
                    <input type="radio" class="answer" id="option-a" name="quiz-options">
                    <label for="option-a" class="text_option_a"> Executed </label>
                 </li>
                 <li>
                    <input type="radio" class="answer" id="option-b" name="quiz-options">
                    <label for="option-a" class="text_option_b"> Processing</label>
                 </li>
                 <li>
                    <input type="radio" class="answer" id="option-c" name="quiz-options">
                    <label for="option-a" class="text_option_c">Processing  </label>
                 </li>
                 <li>
                    <input type="radio" class="answer" id="option-d" name="quiz-options">
                    <label for="option-a" class="text_option_d"> Global</label>
                 </li>
                
            </ul>
            <button id="submit">Submit</button>
        </div>
        <script src="./quiz-app.js"></script>        
    </body>
    </html>
